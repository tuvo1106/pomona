<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <!--
    Pomona. One ECG deflection: the shape the ECG page draws, in the red the heart
    charts use (the group-heart token, oklch(0.66 0.19 15)).

    Drawn from scratch for this repo, MIT with the rest of it. Nothing here is derived from
    another project's mark; the purple bolt this replaced arrived with a scaffold and its
    provenance was never recorded.

    Designed at 16px rather than scaled down to it: one stroke, two units wide, no filters.
    A tab is the only size this file is ever drawn at.

    One colour, not a prefers-color-scheme pair, because this red clears 3:1 on both grounds
    (3.41:1 on white, 5.86:1 on the app's dark background), so there is nothing to keep in
    sync. The header draws its own copy instead of loading this file (components/AppMark.tsx):
    the app's theme toggle is its own, and an img element can't see it.

    Keep this comment free of double hyphens. XML forbids them inside a comment, SVG is
    parsed strictly, and a browser silently falls back to the default tab icon rather than
    reporting the error. tests/test_static_assets.py fails if that happens again.
  -->
  <path d="M2 8.5h2.6l1.7-4 2.2 6.6 1.4-2.6H14" stroke="#ef546c" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
