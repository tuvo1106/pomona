version: 2

updates:
  # Python, via the `uv` ecosystem rather than `pip`. It reads pyproject.toml *and* uv.lock, so its
  # PRs update the lockfile and need nothing done by hand. `pip` would have been wrong twice here:
  # it never touches uv.lock, and it doesn't parse PEP 735 [dependency-groups], which is where
  # pytest, ruff and httpx live -- so the dev tools would never have been offered an update at all.
  # This project also has no [tool.poetry] table and builds with uv_build, so there's a fair chance
  # the pip parser would have found no manifest it recognised and simply errored.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # These move together and are only ever bumped together by hand anyway, so one PR rather
      # than five that each fail on their own.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
