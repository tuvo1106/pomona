name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, explicitly. A public repository's default GITHUB_TOKEN permissions are an
# org-level setting rather than a property of this file, so stating it here is the only way the
# repo guarantees its own CI can't write to itself. Nothing in these jobs needs more than read.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
